    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cele_theme_mode_v1');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || !saved;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
          var savedPersonalityTheme = localStorage.getItem('cele_active_theme_id') || 'vault-tec';
          document.documentElement.setAttribute('data-personality-theme', savedPersonalityTheme);

          var palettes = {
            'vault-tec': isDark ? { bg: '#080E1E', card: '#0E1B38', prim: '#FBC02D', onPrim: '#080E1E', bord: '#2B447A' } : { bg: '#F0F4FA', card: '#FFFFFF', prim: '#1E40AF', onPrim: '#FFFFFF', bord: '#BFDBFE' },
            'nuka-cola': isDark ? { bg: '#16090B', card: '#241014', prim: '#FB7185', onPrim: '#16090B', bord: '#5E2630' } : { bg: '#FFF8F6', card: '#FFFFFF', prim: '#DC2626', onPrim: '#FFFFFF', bord: '#F5C2BE' },
            'power-armor': isDark ? { bg: '#0E1116', card: '#161B22', prim: '#FB923C', onPrim: '#110A04', bord: '#364150' } : { bg: '#F3F5F8', card: '#FFFFFF', prim: '#C2410C', onPrim: '#FFFFFF', bord: '#CBD5E1' },
            'radaway-medbay': isDark ? { bg: '#071512', card: '#0D221D', prim: '#34D399', onPrim: '#052018', bord: '#234E43' } : { bg: '#F2FBF8', card: '#FFFFFF', prim: '#047857', onPrim: '#FFFFFF', bord: '#B8E3D4' }
          };
          var p = palettes[savedPersonalityTheme] || palettes['vault-tec'];
          document.documentElement.style.setProperty('--theme-canvas-bg', p.bg);
          document.documentElement.style.setProperty('--theme-card-bg', p.card);
          document.documentElement.style.setProperty('--theme-border', p.bord);
          document.documentElement.style.setProperty('--theme-primary', p.prim);
          document.documentElement.style.setProperty('--theme-on-primary', p.onPrim);

          var savedDistraction = localStorage.getItem('cele_distraction_free_v1');
          if (savedDistraction === 'true') {
            document.documentElement.setAttribute('data-distraction-free', 'true');
          }
        } catch (e) {}
      })();
    </script>
